name: Build IPA

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodeproj gem
        run: sudo gem install xcodeproj

      - name: Generate Xcode project
        run: ruby generate_project.rb

      - name: List targets
        run: xcodebuild -project HelloApp.xcodeproj -list

      - name: Build (Release, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project HelloApp.xcodeproj \
            -scheme HelloApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build | tail -150

      - name: Package IPA
        run: |
          APP_PATH=$(find build -name "HelloApp.app" -path "*Release-iphoneos*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: HelloApp.app not found"
            find build -name "*.app" || true
            exit 1
          fi
          echo "Found app: $APP_PATH"
          rm -rf Payload HelloApp.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          if command -v ldid >/dev/null 2>&1; then
            ldid -S "Payload/HelloApp.app/HelloApp" || true
          fi
          zip -qry HelloApp.ipa Payload
          ls -la HelloApp.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelloApp-ipa
          path: HelloApp.ipa
          if-no-files-found: error
          retention-days: 30
